name: Validate Godot project

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.4.1", "4.5.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download official Godot editor
        env:
          GODOT_VERSION: ${{ matrix.godot }}
        run: |
          curl --fail --location --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - name: Import, parse, test and smoke-test
        env:
          GODOT_VERSION: ${{ matrix.godot }}
        run: python3 tools/validate.py --godot "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
